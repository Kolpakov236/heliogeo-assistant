[tool.poetry]
name = "heliogeo-assistant"
version = "0.1.0"
description = "Автоматизированная система помощи гелиогеофизику"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "heliogeo", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pydantic-settings = "^2.2"
influxdb-client = "^1.40"
httpx = "^0.27"
jinja2 = "^3.1"
reportlab = "^4.1"
apscheduler = "^3.10"
typer = "^0.12"
python-telegram-bot = "^21.0"
tenacity = "^8.2"
pyyaml = "^6.0"
python-dotenv = "^1.0"
click = "8.1.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.9"
types-pyyaml = "^6.0"
pre-commit = "^4.6.2"
types-reportlab = "^5.0.0.20260911"

[tool.poetry.scripts]
heliogeo = "heliogeo.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src/heliogeo --cov-report=term-missing"

[tool.coverage.run]
source = ["src/heliogeo"]
omit = ["*/tests/*", "*/__init__.py"]
