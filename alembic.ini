# Конфигурация Alembic (миграции PostgreSQL). Подробности: docs/database.md
[alembic]
# Каталог миграций; %(here)s — каталог этого файла, поэтому работает из любого cwd
script_location = %(here)s/migrations

# Имена файлов: 0001_baseline.py, 0002_forecast_tables.py (номер задаёт make revision ... id=NNNN)
file_template = %%(rev)s_%%(slug)s

# Чтобы alembic находил пакет heliogeo и без установки в окружение
prepend_sys_path = %(here)s/src
path_separator = os

# URL берётся из настроек приложения (.env: DATABASE_URL или POSTGRES_*), см. migrations/env.py.
# Явно заданный здесь URL (или set_main_option в тестах) приоритетнее.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
