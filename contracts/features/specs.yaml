# Спецификации признаков для Feature Store (вид «features», задача B3-01).
# Формат, правила и состав — docs/contracts.md.
#
# available_delay — через сколько после момента измерения значение становится известно
# системе (ISO 8601: только дни и время, например PT3H, P1D, PT0S). Признак на момент t
# считается по данным с меткой времени не позже t - available_delay; окна «за N суток»
# заканчиваются в этот же момент.
#
# status: planned — признак объявлен, но Feature Store его ещё не считает; active — считает.
# Любое изменение этого файла (состав, задержки, статусы) требует повышения version:
# version — это feature_set_v, она записывается в строки признаков и прогнозов.
#
# Все задержки предварительные: файл не подписан, их подтвердит владелец SWX API
# или предметный эксперт (см. note у каждого признака).
version: "0.1.0"
approved_by: null
approved_at: null

