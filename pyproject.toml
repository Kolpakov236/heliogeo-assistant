[tool.poetry]
name = "heliogeo-assistant"
version = "0.1.0"
description = "Автоматизированная система помощи гелиогеофизику"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "heliogeo", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6"
pydantic-settings = "^2.2"
influxdb-client = "^1.40"
httpx = "^0.27"
jinja2 = "^3.1"
reportlab = "^4.1"
apscheduler = "^3.10"
typer = "^0.12"
python-telegram-bot = "^21.0"
tenacity = "^8.2"
pyyaml = "^6.0"
python-dotenv = "^1.0"
click = "8.1.8"
sqlalchemy = "^2.0"
alembic = "^1.13"
psycopg = {extras = ["binary"], version = "^3.2"}
pyarrow = "^26.0.0"
boto3 = "^1.43.114"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.9"
types-pyyaml = "^6.0"
pre-commit = "^4.6.2"
types-reportlab = "^5.0.0.20260911"
import-linter = "^2.0"

[tool.poetry.scripts]
heliogeo = "heliogeo.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# boto3 и pyarrow не поставляют типов; обращения к ним собраны в storage/s3.py и storage/lake.py
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -m 'not db' --cov=src/heliogeo --cov-report=term-missing"
markers = ["db: тесты, которым нужен PostgreSQL (make up; запуск: make test-db)"]

[tool.coverage.run]
source = ["src/heliogeo"]
omit = ["*/tests/*", "*/__init__.py"]

# Границы модулей проверяет `lint-imports` (входит в `make lint`). Запрещены и косвенные импорты.
[tool.importlinter]
root_packages = ["heliogeo"]

[[tool.importlinter.contracts]]
name = "generation не ходит в хранилище напрямую"
type = "forbidden"
source_modules = ["heliogeo.generation"]
forbidden_modules = ["heliogeo.storage", "heliogeo.extractors"]

[[tool.importlinter.contracts]]
name = "validation не видит промптов генератора"
type = "forbidden"
source_modules = ["heliogeo.validation"]
forbidden_modules = ["heliogeo.llm.prompts"]

[[tool.importlinter.contracts]]
name = "forecast не зависит от llm"
type = "forbidden"
source_modules = ["heliogeo.forecast"]
forbidden_modules = ["heliogeo.llm", "heliogeo.generation"]
